<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Elephant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container py-4">
  <header class="mb-4">
    <h1>Animal Website</h1>
  </header>

  <nav class="mb-4">
    <a href="index.html" class="me-3">Home</a>
    <a href="about.html" class="me-3">About</a>
    <a href="new-elephant-form.html" class="me-3">Add</a>
  </nav>

  <main>
    <h2>Add a New Elephant</h2>

    <form id="add-elephant-form" class="mt-4">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input id="name" class="form-control" type="text" placeholder="Enter elephant name" required>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <input id="description" class="form-control" type="text" placeholder="Enter description" required>
      </div>

      <div class="mb-3">
        <label for="gender" class="form-label">Gender</label>
        <select id="gender" class="form-select" required>
          <option value="">Select gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="age" class="form-label">Age</label>
        <input id="age" class="form-control" type="number" placeholder="Enter age" required>
      </div>

      <button type="submit" class="btn btn-primary">Submit</button>
      <a href="index.html" class="btn btn-secondary ms-2">Cancel</a>
    </form>
  </main>

  <script>
    document.getElementById('add-elephant-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const elephant = {
        name: document.getElementById('name').value,
        description: document.getElementById('description').value,
        gender: document.getElementById('gender').value,
        age: parseInt(document.getElementById('age').value)
      };

      try {
        const response = await fetch('/elephants', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(elephant)
        });

        if (response.ok) {
          alert('Elephant added successfully!');
          window.location.href = 'index.html';
        } else {
          alert('Failed to add elephant.');
        }
      } catch (error) {
        console.error('Error adding elephant:', error);
        alert('Error adding elephant.');
      }
    });
  </script>
</body>
</html>
