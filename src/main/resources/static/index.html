<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elephant List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container py-4">
  <header class="mb-4">
    <h1>Elephant Website</h1>
  </header>

  <nav class="mb-4">
    <a href="index.html" class="me-3">Home</a>
    <a href="about.html" class="me-3">About</a>
    <a href="new-animal-form.html" class="me-3">Add</a>
  </nav>

  <div class="d-flex flex-wrap align-items-center gap-3 mb-4">
    <form id="search-form" class="d-flex me-3" role="search">
      <input id="search-input" class="form-control me-2" type="search" placeholder="Search by name..." aria-label="Search">
      <button class="btn btn-primary" type="submit">Search</button>
    </form>

    <select id="gender-filter" class="form-select w-auto">
      <option value="">All Genders</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>

    <select id="age-filter" class="form-select w-auto">
      <option value="">All Ages</option>
      <option value="adult">Adults</option>
      <option value="child">Children</option>
    </select>
  </div>

  <main class="row mt-4">
    <table class="table table-striped rounded-3 overflow-hidden mt-4">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Gender</th>
          <th>Age</th>
        </tr>
      </thead>
      <tbody id="elephant-table-body">
      </tbody>
    </table>
  </main>

  <script>
    let allElephants = [];

    async function fetchAllElephants() {
      try {
        const response = await fetch('/elephants');
        if (!response.ok) throw new Error('Failed to fetch elephants');
        allElephants = await response.json();
        applyFilters();
      } catch (error) {
        console.error('Error fetching elephants:', error);
      }
    }

    function applyFilters() {
      let filtered = [...allElephants];

      const searchKey = document.getElementById('search-input').value.trim().toLowerCase();
      const gender = document.getElementById('gender-filter').value;
      const ageFilter = document.getElementById('age-filter').value;

      if (searchKey) {
        filtered = filtered.filter(e => e.name && e.name.toLowerCase().includes(searchKey));
      }

      if (gender) {
        filtered = filtered.filter(e => e.gender && e.gender.toLowerCase() === gender.toLowerCase());
      }

      if (ageFilter === 'adult') {
        filtered = filtered.filter(e => e.age >= 18);
      } else if (ageFilter === 'child') {
        filtered = filtered.filter(e => e.age < 18);
      }

      renderTable(filtered);
    }

    function renderTable(elephants) {
      const tableBody = document.getElementById('elephant-table-body');
      tableBody.innerHTML = '';

      if (!elephants.length) {
        tableBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No elephants found</td></tr>';
        return;
      }

      elephants.forEach(elephant => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td><a href="details.html?id=${elephant.elephantId}" style="color:#000000">${elephant.elephantId}</a></td>
          <td>${elephant.name || ''}</td>
          <td>${elephant.gender || ''}</td>
          <td>${elephant.age ?? 0}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    document.getElementById('search-form').addEventListener('submit', e => {
      e.preventDefault();
      applyFilters();
    });

    document.getElementById('gender-filter').addEventListener('change', applyFilters);
    document.getElementById('age-filter').addEventListener('change', applyFilters);

    window.onload = fetchAllElephants;
  </script>
</body>
</html>
