<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elephant Details</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body class="container py-4">
  <header class="mb-4">
    <h1>Animal Website</h1>
  </header>

  <nav class="mb-4">
    <a href="index.html" class="me-3">Home</a>
    <a href="details.html" class="me-3">Details</a>
    <a href="about.html" class="me-3">About</a>
    <a href="new-elephant-form.html" class="me-3">Add</a>
  </nav>

  <main id="elephant-details" class="mt-4">
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    async function loadElephant() {
      if (!id) {
        document.getElementById("elephant-details").innerHTML =
          `<p class="text-danger">Missing elephant ID in URL.</p>`;
        return;
      }

      try {
        const response = await fetch(`/elephants/${id}`);
        if (!response.ok) throw new Error("Elephant not found");
        const elephant = await response.json();

        document.getElementById("elephant-details").innerHTML = `
          <div class="card">
            <h5 class="card-header">${elephant.name || "Unnamed Elephant"}</h5>
            <div class="card-body">
              <h5 class="card-title">ID: ${elephant.elephantId}</h5>
              <p class="card-text">Description: ${elephant.description || "No description available."}</p>
              <p class="card-text">Gender: ${elephant.gender || "Unknown"}</p>
              <p class="card-text">Age: ${elephant.age ?? "N/A"}</p>

              <a href="update-elephant-form.html?id=${elephant.elephantId}" class="btn btn-primary me-2">
                Edit Elephant
              </a>
              <button class="btn btn-danger me-2" onclick="deleteElephant(${elephant.elephantId})">
                Delete Elephant
              </button>
              <a href="index.html" class="btn btn-secondary">Go Back</a>
            </div>
          </div>
        `;
      } catch (error) {
        console.error("Error loading elephant:", error);
        document.getElementById("elephant-details").innerHTML =
          `<p class="text-danger">Failed to load elephant details.</p>`;
      }
    }

    async function deleteElephant(elephantId) {
      if (!confirm("Are you sure you want to delete this elephant?")) return;
      await fetch(`/elephants/${elephantId}`, { method: "DELETE" });
      window.location.href = "index.html";
    }

    loadElephant();
  </script>
</body>
</html>
